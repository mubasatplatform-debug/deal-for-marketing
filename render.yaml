# Render Blueprint for the standalone (off-platform) deploy of DEAL FOR MARKETING.
# https://render.com/docs/blueprint-spec
#
# DEAL_STANDALONE=1 builds the nitro `node-server` preset (.output/server) without
# the Grok platform middleware, and makes `npm start` refuse to boot without
# DATABASE_URL (no silent in-memory PGLite). `npm start` applies migrations
# (scripts/migrate.mjs) before starting the server.
#
# No secrets here: every `sync: false` key is entered in the Render dashboard.
services:
  - type: web
    name: deal-for-marketing
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    buildCommand: npm ci --include=dev --ignore-scripts && npm run build:standalone
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Needed at build time (preset, head tags) and at runtime (DB guard).
      - key: DEAL_STANDALONE
        value: "1"
      # Email + password sign-in: the Grok Google / X broker only accepts
      # Grok-hosted callbacks.
      - key: VITE_SIGNIN_MODE
        value: password
      # Postgres connection string (Neon, Render Postgres, ...). Required.
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      # Public origin of this service, e.g. https://deal.mubasat.net
      - key: BETTER_AUTH_URL
        sync: false
      # Other addresses allowed to sign in, comma-separated,
      # e.g. https://deal-for-marketing.onrender.com
      - key: AUTH_TRUSTED_ORIGINS
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Or any OpenAI-compatible endpoint for Deal Line
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LEADS_WEBHOOK_URL
        sync: false
      - key: LEADS_WEBHOOK_SECRET
        sync: false
      # Mail relay for password-reset and request-thread emails
      - key: MAIL_RELAY_URL
        sync: false
      - key: MAIL_RELAY_TOKEN
        sync: false
      # Optional: private Vercel Blob store for thread attachments; unset keeps
      # file bytes in Postgres.
      - key: BLOB_READ_WRITE_TOKEN
        sync: false
      # «مكتب المحامي» bank-transfer details and (untested) Moyasar keys
      - key: LAW_BANK_NAME
        sync: false
      - key: LAW_BANK_BENEFICIARY
        sync: false
      - key: LAW_BANK_IBAN
        sync: false
      - key: MOYASAR_SECRET_KEY
        sync: false
      - key: MOYASAR_WEBHOOK_SECRET
        sync: false
      # «مكتب المحامي» video consultations (optional): LiveKit embedded calls.
      # Unset -> Jitsi Meet fallback in a new tab.
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      # Optional: secret for client meeting links (defaults to BETTER_AUTH_SECRET)
      - key: LAW_MEET_SECRET
        sync: false
